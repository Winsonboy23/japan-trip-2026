<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪・金澤・高山・京都 行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F5; --ink:#1B1B18; --ink2:#726F66; --ink3:#9A968B;
    --line:#E7E4DB; --card:#FFFFFF; --accent:#2E6E63; --accent-soft:#EAF1EE;
    --pending:#B4711E; --pending-soft:#FBF1E3;
    --sans:"Noto Sans TC",-apple-system,system-ui,sans-serif;
    --serif:"Noto Serif TC",serif;
    --shadow:0 1px 2px rgba(27,27,24,.05),0 6px 20px rgba(27,27,24,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
    padding:0 0 40px;-webkit-font-smoothing:antialiased;}

  header.top{padding:26px 18px 6px;max-width:640px;margin:0 auto;}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:500;text-transform:uppercase;}
  h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.25;margin:6px 0 8px;letter-spacing:.01em;}
  h1 .lockword{cursor:pointer;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);}
  .meta b{font-weight:500;color:var(--ink);}

  .filterwrap{position:sticky;top:0;z-index:30;background:linear-gradient(var(--paper) 78%,rgba(250,249,245,0));
    padding:12px 18px 12px;margin:0 auto;max-width:640px;}
  .filterbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none;}
  .filterbar::-webkit-scrollbar{display:none;}
  .pchip{flex:none;font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap;transition:.15s;}
  .pchip:hover{border-color:var(--ink3);}
  .pchip.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .fcap{font-size:12.5px;color:var(--ink3);margin:2px auto -6px;padding:0 18px;max-width:640px;}

  .wrap{max-width:640px;margin:0 auto;padding:0 18px;}
  .timeline{position:relative;padding:6px 0 20px;}
  .rail{position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px;}

  .day{position:relative;padding:22px 0 4px 52px;}
  .day .dtag{font-family:var(--serif);font-weight:700;font-size:15px;}
  .day .dsub{font-size:12px;color:var(--ink3);margin-top:1px;}
  .day .dnum{position:absolute;left:14px;top:22px;width:26px;height:26px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;
    justify-content:center;font-family:var(--sans);}

  .entry{position:relative;padding:0 0 0 52px;}
  .node{position:absolute;left:20px;top:16px;width:14px;height:14px;border-radius:50%;
    background:var(--card);border:2px solid var(--accent);z-index:2;}
  .node.pending{border-color:var(--pending);border-style:dashed;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    margin:8px 0;box-shadow:var(--shadow);}
  .card .crow{display:flex;align-items:flex-start;gap:10px;}
  .card .ic{font-size:17px;line-height:1.3;flex:none;filter:grayscale(.15);}
  .card .body{flex:1;min-width:0;}
  .card .ttl{font-weight:500;font-size:15px;letter-spacing:.01em;}
  .card .ttl.maplink{cursor:pointer;}
  .card .ttl.maplink::after{content:"🗺";font-size:12px;margin-left:5px;color:var(--ink3);}
  .mapbox{margin-top:9px;}
  .mapbox iframe{display:block;width:100%;height:190px;border:0;border-radius:10px;background:#EFEDE6;}
  .mapbox a{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--accent);text-decoration:none;}
  .card .time{font-size:13px;color:var(--accent);font-weight:500;margin-top:1px;}
  .card .dtl{font-size:12.5px;color:var(--ink2);margin-top:3px;word-break:break-word;}
  .card .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;}
  .tag{font-size:11px;color:var(--ink2);background:#F2F0E9;border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .status{font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .status.ok{color:var(--accent);background:var(--accent-soft);}
  .status.pend{color:var(--pending);background:var(--pending-soft);}
  .whorow{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;}
  .who{font-size:10.5px;color:#5f5d55;background:#EFEDE6;border-radius:5px;padding:1px 6px;}
  .who.all{background:var(--accent-soft);color:var(--accent);}

  .move{position:relative;padding:0 0 0 52px;margin:2px 0;}
  .move .mnode{position:absolute;left:23px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--line);z-index:2;}
  .move .mpill{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px dashed var(--line);
    border-radius:999px;padding:6px 13px 6px 11px;font-size:13px;color:var(--ink2);flex-wrap:wrap;}
  .move .mmode{font-size:15px;filter:grayscale(.1);}
  .move .mdur{font-weight:500;color:var(--ink);}
  .move .mnote{color:var(--ink3);font-size:12px;}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow">Autumn Japan · 2026</div>
  <h1><span class="lockword" id="lockword">大阪</span>・金澤・高山・京都</h1>
  <div class="meta">
    <span>📅 <b id="mrange">10/12 – 10/19</b></span>
    <span>👥 <b>7 人</b>（<span id="mlines">2</span> 組動線）</span>
    <span id="mgate">✈️ 高雄進・高雄出</span>
  </div>
</header>

<div class="filterwrap"><div class="filterbar" id="filterbar"></div></div>
<div class="fcap" id="fcap"></div>

<div class="wrap"><div class="timeline" id="tl"><div class="rail"></div></div></div>

<script>
const STOP_ICONS={flight:'✈️',hotel:'🛏️',checkout:'🧳',spot:'📍',meal:'🍽️',note:'📝'};
const MODES={walk:['🚶','步行'],train:['🚆','電車'],bus:['🚌','巴士'],car:['🚗','開車'],taxi:['🚕','計程車'],flight:['✈️','飛機'],ferry:['⛴️','渡輪'],bike:['🚲','單車'],other:['·','其他']};
const GROUPS={A:{name:'七撰',members:['W','M','T','Z']},B:{name:'王家',members:['K']}};
const G_ORDER=['A','B'];
/* 只屬於這些人的項目預設隱藏，點標題「大阪」輸入密碼才顯示（純前端遮蔽，原始碼仍看得到） */
const SECRET=['W','M'];
const PASSCODE='0420';

/* ===== 行程內容寫死在這裡：要改就改這個陣列後重新 push =====
   kind:'day'  → 日期分隔（date/weekday/dayNum）
   kind:'stop' → 行程卡（type: flight|hotel|checkout|spot|meal|note；status: ok|pend）
                 加 map:'地點關鍵字' → 標題可點，展開 Google 地圖
   kind:'move' → 兩點間移動（mode: 見 MODES；duration；from/to；note）
   who: ['all'] 或 ['W','M',...]（W=Winson M=Maggie T=Tai Z=芝芝 K=王家×3）
        顯示時歸成兩組：七撰=W/M/T/Z、王家=K；只含 W/M 的項目要解鎖才看得到 */
const SEED=[
  {kind:'day',date:'10/10',weekday:'六',dayNum:1},
  {kind:'stop',type:'flight',title:'Peach MM24　台北 TPE → 大阪 KIX',time:'09:30 → 13:20',detail:'2h50m｜Winson・Maggie 兩人',tag:'',status:'ok',who:['W','M']},
  {kind:'move',from:'關西機場 KIX T2',to:'神戶波多比亞',mode:'bus',duration:'約 1h',note:'阪急利木津巴士 → 三宮，轉 Port Liner 到飯店',who:['W','M']},
  {kind:'stop',type:'hotel',title:'神戶波多比亞飯店 Kobe Portopia Hotel',time:'',detail:'10/10 → 10/12・神戶遊玩｜Port Liner「市民廣場站」旁',tag:'',status:'ok',who:['W','M']},

  {kind:'day',date:'10/12',weekday:'一',dayNum:3},
  {kind:'stop',type:'flight',title:'Tigerair IT284　高雄 KHH → 大阪 KIX',time:'06:55 → 10:55',detail:'3h00m｜5 位（Tai・芝芝・王家×3）',tag:'',status:'ok',who:['T','Z','K']},
  {kind:'move',from:'神戶',to:'大阪',mode:'train',duration:'約 1h',note:'回大阪與大家會合',who:['W','M']},
  {kind:'stop',type:'hotel',title:'Minn Shin-Osaka（大阪）',time:'入住 15:00',detail:'10/12 → 10/13・全員會合｜2 間房 → 7 人請重算',tag:'',status:'ok',who:['all'],map:'Minn Shin-Osaka'},

  {kind:'day',date:'10/13',weekday:'二',dayNum:4},
  {kind:'stop',type:'checkout',title:'Minn Shin-Osaka 退房',time:'10:00',detail:'',tag:'',status:'ok',who:['all']},
  {kind:'move',from:'大阪',to:'金澤',mode:'train',duration:'約 2.5–3h',note:'特急雷鳥＋北陸新幹線（敦賀轉乘）',who:['all']},
  {kind:'stop',type:'hotel',title:'SOKI KANAZAWA（金澤）',time:'入住 15:00',detail:'10/13 → 10/15｜2 間房 → 7 人請重算',tag:'',status:'ok',who:['all']},

  {kind:'day',date:'10/14',weekday:'三',dayNum:5},
  {kind:'stop',type:'hotel',title:'SOKI KANAZAWA（金澤）',time:'',detail:'住宿',tag:'',status:'ok',who:['all']},

  {kind:'day',date:'10/15',weekday:'四',dayNum:6},
  {kind:'stop',type:'checkout',title:'SOKI KANAZAWA 退房',time:'11:00',detail:'兩組人在此分開',tag:'',status:'ok',who:['all']},
  {kind:'move',from:'金澤',to:'高山',mode:'bus',duration:'約 2.5h',note:'濃飛巴士',who:['W','M','T','Z']},
  {kind:'stop',type:'hotel',title:'綠風苑 きよはる Ryokufuen Kiyoharu（高山）',time:'',detail:'10/15 → 10/16',tag:'TWD 13,437',status:'ok',who:['W','M','T','Z']},
  {kind:'move',from:'金澤',to:'京都',mode:'train',duration:'約 2.25h',note:'北陸新幹線＋東海道新幹線（米原轉乘）',who:['K']},
  {kind:'stop',type:'hotel',title:'Hotel The M’s Kyoto（京都）',time:'',detail:'10/15 → 10/19・王家先回京都｜請確認訂房',tag:'',status:'ok',who:['K']},

  {kind:'day',date:'10/16',weekday:'五',dayNum:7},
  {kind:'stop',type:'checkout',title:'綠風苑 退房',time:'',detail:'',tag:'',status:'ok',who:['W','M','T','Z']},
  {kind:'move',from:'高山',to:'京都',mode:'bus',duration:'約 3–4h',note:'濃飛巴士 ＋ JR',who:['W','M','T','Z']},
  {kind:'stop',type:'hotel',title:'京都 Airbnb 入住',time:'',detail:'23-1 Higashikujō Nakafudanotsujichō, Kyoto 601-8026｜10/16 → 10/19',tag:'Airbnb',status:'ok',who:['W','M','T','Z']},
  {kind:'stop',type:'hotel',title:'Hotel The M’s Kyoto（京都）',time:'',detail:'住宿',tag:'',status:'ok',who:['K']},

  {kind:'day',date:'10/17',weekday:'六',dayNum:8},
  {kind:'stop',type:'hotel',title:'京都 Airbnb',time:'',detail:'住宿',tag:'',status:'ok',who:['W','M','T','Z']},
  {kind:'stop',type:'hotel',title:'Hotel The M’s Kyoto',time:'',detail:'住宿',tag:'',status:'ok',who:['K']},

  {kind:'day',date:'10/18',weekday:'日',dayNum:9},
  {kind:'stop',type:'hotel',title:'京都 Airbnb',time:'',detail:'住宿',tag:'',status:'ok',who:['W','M','T','Z']},
  {kind:'stop',type:'hotel',title:'Hotel The M’s Kyoto',time:'',detail:'住宿',tag:'',status:'ok',who:['K']},

  {kind:'day',date:'10/19',weekday:'一',dayNum:10},
  {kind:'stop',type:'checkout',title:'京都 Airbnb 退房',time:'',detail:'',tag:'',status:'ok',who:['W','M','T','Z']},
  {kind:'stop',type:'checkout',title:'Hotel The M’s Kyoto 退房',time:'',detail:'',tag:'',status:'ok',who:['K']},
  {kind:'move',from:'京都',to:'關西機場 KIX',mode:'train',duration:'約 75min',note:'HARUKA 特急 / 利木津巴士',who:['T','Z','K']},
  {kind:'stop',type:'flight',title:'AirAsia AK171　大阪 KIX → 高雄 KHH',time:'13:45 → 16:00',detail:'3h15m｜5 位返台（Tai・芝芝・王家×3）',tag:'',status:'ok',who:['T','Z','K']},
  {kind:'stop',type:'note',title:'Winson＋Maggie 續留日本',time:'',detail:'10/19 – 10/27 住宿與行程待安排（動線往神戶收）',tag:'',status:'pend',who:['W','M']},

  {kind:'day',date:'10/27',weekday:'二',dayNum:18},
  {kind:'stop',type:'flight',title:'Starlux JX835　神戶 UKB → 台北 TPE',time:'11:30 → 13:50',detail:'3h20m｜Winson・Maggie 兩人',tag:'',status:'ok',who:['W','M']},
];
/* ===== 行程內容結束 ===== */

let filter='all',unlocked=false;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isSecret(e){const w=e.who||['all'];return !w.includes('all')&&w.every(id=>SECRET.includes(id));}
function groupsOf(e){const w=e.who||['all'];if(w.includes('all'))return G_ORDER;return G_ORDER.filter(g=>GROUPS[g].members.some(id=>w.includes(id)));}
function isVis(e){
  if(!unlocked&&isSecret(e))return false;
  if(filter==='all')return true;
  return groupsOf(e).includes(filter);
}

function buildFilter(){
  const fb=document.getElementById('filterbar');
  const chips=[{id:'all',label:'全部'}].concat(G_ORDER.map(id=>({id,label:GROUPS[id].name})));
  fb.innerHTML=chips.map(c=>`<button class="pchip ${filter===c.id?'sel':''}" data-f="${c.id}">${esc(c.label)}</button>`).join('');
  fb.querySelectorAll('.pchip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;buildFilter();render();});
  document.getElementById('fcap').textContent = filter==='all' ? '顯示所有行程，卡片右下標記同行組別' : `只顯示${GROUPS[filter].name}的行程`;
}
function whoChips(e){
  if(filter!=='all')return '';
  const w=e.who||['all'];
  if(w.includes('all'))return `<div class="whorow"><span class="who all">全員</span></div>`;
  return `<div class="whorow">${groupsOf(e).map(g=>`<span class="who">${esc(GROUPS[g].name)}</span>`).join('')}</div>`;
}
function render(){
  const tl=document.getElementById('tl');const E=SEED;
  const dayVis={};let base=0;
  for(let i=0;i<E.length;i++){if(E[i].kind==='day'){let vis=false;for(let j=i+1;j<E.length&&E[j].kind!=='day';j++){if(isVis(E[j])){vis=true;break;}}dayVis[i]=vis;if(vis&&!base)base=E[i].dayNum;}}
  let h='<div class="rail"></div>';
  E.forEach((e,i)=>{
    if(e.kind==='day'){
      if(!dayVis[i])return;
      h+=`<div class="day"><div class="dnum">${e.dayNum-base+1}</div><div class="dtag">${esc(e.date)}</div><div class="dsub">星期${esc(e.weekday)}</div></div>`;
    }else if(e.kind==='stop'){
      if(!isVis(e))return;
      const st=e.status==='pend'?'<span class="status pend">待訂</span>':'<span class="status ok">已訂</span>';
      const tag=e.tag?`<span class="tag">${esc(e.tag)}</span>`:'';
      const q=e.map?encodeURIComponent(e.map):'';
      const ttl=e.map?`<div class="ttl maplink" data-q="${q}">${esc(e.title)}</div>`:`<div class="ttl">${esc(e.title)}</div>`;
      h+=`<div class="entry"><div class="node ${e.status==='pend'?'pending':''}"></div><div class="card"><div class="crow"><div class="ic">${STOP_ICONS[e.type]||'📍'}</div><div class="body">${ttl}${e.time?`<div class="time">${esc(e.time)}</div>`:''}${e.detail?`<div class="dtl">${esc(e.detail)}</div>`:''}${whoChips(e)}${e.map?'<div class="mapbox" hidden></div>':''}</div><div class="right">${st}${tag}</div></div></div></div>`;
    }else if(e.kind==='move'){
      if(!isVis(e))return;
      const m=MODES[e.mode]||MODES.other;const route=(e.from||e.to)?`${esc(e.from||'')} → ${esc(e.to||'')}`:'移動';
      const wc=(filter==='all'&&e.who&&!e.who.includes('all'))?` ・${groupsOf(e).map(g=>GROUPS[g].name).join('/')}`:'';
      h+=`<div class="move"><div class="mnode"></div><div class="mpill"><span class="mmode">${m[0]}</span><span class="mdur">${esc(e.duration||m[1])}</span><span class="mnote">${route}${e.note?'・'+esc(e.note):''}${wc}</span></div></div>`;
    }
  });
  tl.innerHTML=h;
  tl.querySelectorAll('.maplink').forEach(t=>t.onclick=()=>{
    const box=t.parentNode.querySelector('.mapbox');
    if(!box.innerHTML)box.innerHTML=`<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${t.dataset.q}&output=embed"></iframe><a href="https://www.google.com/maps/search/?api=1&query=${t.dataset.q}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>`;
    box.hidden=!box.hidden;
  });
}
/* 解鎖：除了行程卡，表頭的日期區間、動線數、進出點也一併還原成完整版 */
document.getElementById('lockword').onclick=()=>{
  if(unlocked)return;
  if(prompt('請輸入密碼')!==PASSCODE)return;
  unlocked=true;
  document.getElementById('mrange').textContent='10/10 – 10/27';
  document.getElementById('mlines').textContent='3';
  document.getElementById('mgate').textContent='✈️ 台北 / 高雄進・神戶 / 高雄出';
  render();
};
buildFilter();render();
</script>
</body>
</html>
